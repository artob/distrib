# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "distrib-wasm"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
#documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# See: https://readmer.dev
[package.metadata.readmer.project]
title = "Distrib: WebAssembly Support"
summary = "Distrib helps you distribute your software."

[features]
default = ["all", "std"]
all = []
alloc = ["distrib-common/alloc", "serde?/alloc"]
std = ["alloc", "distrib-common/std", "serde?/std", "wasm-bindgen?/std"]
unstable = []

# Features:
export = ["wasm-bindgen", "dep:distrib-macros", "distrib-macros/wasm-bindgen"]
tracing = ["dep:tracing"]

# Interoperability:
serde = ["dep:serde"]
wasm-bindgen = ["alloc", "dep:wasm-bindgen"]

[dependencies]
distrib-common.workspace = true

# Features:
tracing = { workspace = true, optional = true }
distrib-macros = { workspace = true, optional = true }

# Interoperability:
serde = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
