# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "distrib-build"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
#documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# See: https://readmer.dev
[package.metadata.readmer.project]
title = "Distrib: Build"
summary = "Distrib helps you distribute your software."

[features]
default = ["all", "std"]
all = ["languages"]
alloc = ["distrib-common/alloc"]
std = ["alloc", "distrib-common/std"]
unstable = []

# Languages:
languages = ["beam", "dart", "gleam", "js", "python", "ruby", "rust", "wasm"]
beam = ["std"]
dart = ["std"]
gleam = ["beam"]
js = ["std", "dep:napi-build"]
python = ["std", "dep:pyo3-build-config"]
ruby = ["std", "dep:rb-sys-build", "dep:rb-sys-env"]
rust = ["std"]
wasm = ["std"]

# Language aliases:
elixir = ["beam"]
erlang = ["beam"]

[dependencies]
distrib-common.workspace = true

# Languages:
napi-build = { workspace = true, optional = true }
pyo3-build-config = { workspace = true, optional = true }
rb-sys-build = { workspace = true, optional = true }
rb-sys-env = { workspace = true, optional = true }

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
