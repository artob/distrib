# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "distrib-python"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
#documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# See: https://readmer.dev
[package.metadata.readmer.project]
title = "Distrib: Python Support"
summary = "Distrib helps you distribute your software."

[features]
default = ["all", "std"]
all = []
alloc = ["distrib-common/alloc", "serde?/alloc"]
std = ["alloc", "distrib-common/std", "dep:pep440_rs", "dep:pyproject-toml", "dep:toml0", "toml0/std", "serde?/std", "serde_json?/preserve_order"]
unstable = []

# Features:
export = ["pyo3", "dep:distrib-macros", "distrib-macros/pyo3"]
tracing = ["dep:tracing"]

# Interoperability:
pyo3 = ["std", "dep:pyo3", "pyo3/macros"]
serde = ["alloc", "dep:serde", "dep:serde_json"]

[dependencies]
distrib-common.workspace = true

pep440_rs = { workspace = true, optional = true }
pyproject-toml = { workspace = true, optional = true }
thiserror.workspace = true
toml0 = { workspace = true, optional = true, features = ["parse", "display", "serde"] }

# Features:
tracing = { workspace = true, optional = true }
distrib-macros = { workspace = true, optional = true }

# Interoperability:
pyo3 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
