# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "distrib-js"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
#documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# See: https://readmer.dev
[package.metadata.readmer.project]
title = "Distrib: JavaScript Support"
summary = "Distrib helps you distribute your software."

[features]
default = ["all", "std"]
all = []
alloc = ["distrib-common/alloc", "distrib-node/alloc", "distrib-npm/alloc"]
std = ["alloc", "distrib-common/std", "distrib-node/std", "distrib-npm/std"]
unstable = []

# Features:
export = ["distrib-node/export"]
tracing = ["distrib-node/tracing", "distrib-npm/tracing"]

# Interoperability:
serde = ["distrib-node/serde", "distrib-npm/serde"]

[dependencies]
distrib-common.workspace = true
distrib-node.workspace = true
distrib-npm.workspace = true

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
