# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "distrib-rust"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
#documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# See: https://readmer.dev
[package.metadata.readmer.project]
title = "Distrib: Rust Support"
summary = "Distrib helps you distribute your software."

[features]
default = ["all", "std"]
all = []
alloc = ["distrib-common/alloc", "serde?/alloc"]
std = ["alloc", "distrib-common/std", "dep:cargo_toml", "dep:toml1", "serde?/std", "serde_json?/preserve_order"]
unstable = []

# Features:
export = []
tracing = ["dep:tracing"]

# Interoperability:
serde = ["alloc", "dep:serde", "dep:serde_json"]

[dependencies]
distrib-common.workspace = true

cargo_toml = { workspace = true, optional = true }
thiserror.workspace = true
toml1 = { workspace = true, optional = true, features = ["parse", "serde"] }

# Features:
tracing = { workspace = true, optional = true }

# Interoperability:
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
