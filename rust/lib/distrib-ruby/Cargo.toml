# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "distrib-ruby"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
#documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# See: https://readmer.dev
[package.metadata.readmer.project]
title = "Distrib: Ruby Support"
summary = "Distrib helps you distribute your software."

[features]
default = ["all", "std"]
all = []
alloc = ["distrib-common/alloc", "serde?/alloc", "serde_with?/alloc"]
std = ["alloc", "distrib-common/std", "dep:indexmap", "indexmap/std", "dep:serde_norway", "serde?/std", "serde_json?/preserve_order", "serde_with?/std"]
unstable = []

# Features:
export = ["magnus"]
tracing = ["dep:tracing"]

# Interoperability:
magnus = ["std", "dep:magnus"]
serde = ["alloc", "indexmap?/serde", "dep:serde", "dep:serde_json", "dep:serde_with"]

[dependencies]
distrib-common.workspace = true

indexmap = { workspace = true, optional = true }
serde_norway = { workspace = true, optional = true }
thiserror.workspace = true

# Features:
tracing = { workspace = true, optional = true }

# Interoperability:
magnus = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_with = { workspace = true, optional = true }

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
