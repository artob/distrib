# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "distrib-gleam"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
#documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# See: https://readmer.dev
[package.metadata.readmer.project]
title = "Distrib: Gleam Support"
summary = "Distrib helps you distribute your software."

[features]
default = ["all", "std"]
all = ["parse"]
alloc = []
std = ["alloc", "indexmap/std"]
unstable = []

# Features:
parse = ["dep:serde", "dep:serde_with", "dep:toml1"]

# Interoperability:
otter = ["distrib-beam/otter"]
rustler = ["distrib-beam/rustler"]
serde = ["dep:serde"]

[dependencies]
distrib-beam.workspace = true
distrib-common.workspace = true

derive_more = { workspace = true, features = ["display", "from_str"] }
dogma.workspace = true
indexmap.workspace = true
thiserror.workspace = true

# Interoperability:
serde = { workspace = true, optional = true }
serde_with = { workspace = true, optional = true }
toml1 = { workspace = true, optional = true, features = ["parse", "serde"] }

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
