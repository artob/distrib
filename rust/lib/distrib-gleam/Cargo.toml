# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "distrib-gleam"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
#documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# See: https://readmer.dev
[package.metadata.readmer.project]
title = "Distrib: Gleam Support"
summary = "Distrib helps you distribute your software."

[features]
default = ["all", "std"]
all = ["parse"]
alloc = ["distrib-common/alloc", "distrib-beam/alloc", "serde?/alloc", "serde_with?/alloc"]
std = ["alloc", "distrib-common/std", "distrib-beam/std", "dep:indexmap", "indexmap/std", "serde?/std", "serde_with?/std", "toml1?/std"]
unstable = []

# Features:
export = ["distrib-beam/export"]
parse = ["serde"]
tracing = ["dep:tracing"]

# Interoperability:
otter = ["distrib-beam/otter"]
rustler = ["distrib-beam/rustler"]
serde = ["alloc", "dep:serde", "dep:serde_with", "indexmap?/serde", "dep:toml1"]

[dependencies]
distrib-beam.workspace = true
distrib-common.workspace = true

indexmap = { workspace = true, optional = true }
thiserror.workspace = true

# Features:
tracing = { workspace = true, optional = true }

# Interoperability:
serde = { workspace = true, optional = true }
serde_with = { workspace = true, optional = true }
toml1 = { workspace = true, optional = true, features = ["parse", "display", "serde"] }

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
