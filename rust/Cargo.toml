# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "distrib"
version = "0.0.0"
authors = ["Arto Bendiken"]
edition = "2024"
#rust-version = "1.85"
description = "Distrib helps you distribute your software."
#documentation = "https://docs.rs/distrib"
readme = true
homepage = "https://distrib.sh"
repository = "https://github.com/artob/distrib"
license = "Unlicense"
keywords = ["distrib"]
categories = ["command-line-utilities", "no-std"]
publish = true

# See: https://readmer.dev
[package.metadata.readmer.project]
title = "Distrib"
summary = "Distrib helps you distribute your software."

[features]
default = ["all", "std"]
all = []
alloc = ["serde?/alloc"]
cli = ["std", "clientele", "dep:clap"]
std = ["derive_more/std", "alloc"]
unstable = []

# Interoperability:
interops = ["serde"]
serde = ["dep:serde", "alloc"]

[dependencies]
derive_more = { version = "2", default-features = false, features = ["display", "from_str"] }
thiserror = { version = "2", default-features = false }

# Interoperability:
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

# CLI:
clap = { version = "4.5", default-features = false, optional = true }
clientele = { version = "0.3.8", features = [], optional = true }

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "distrib"
path = "src/main.rs"
required-features = ["cli"]

# See: https://github.com/cargo-bins/cargo-binstall/blob/main/SUPPORT.md
[package.metadata.binstall]
disabled-strategies = ["quick-install"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
